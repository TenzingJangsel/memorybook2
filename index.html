<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Important Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<style>
  :root { --display:"Luckiest Guy",system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:#000; overflow:hidden; }
  #vid { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; z-index:1; }

  /* rainbow flashing frame once it's live */
  .flash { position:fixed; inset:0; z-index:2; pointer-events:none; opacity:0;
    box-shadow:inset 0 0 0 14px #ff3fa4; transition:opacity .4s; }
  .flash.on { opacity:1; animation:hue 3s linear infinite; }
  @keyframes hue { to { filter:hue-rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .flash.on{ animation:none; } }

  .banner { position:fixed; top:16px; left:0; right:0; z-index:3; text-align:center; pointer-events:none;
    font-family:var(--display); font-size:clamp(1.4rem,6vw,3rem); color:#fff;
    text-shadow:3px 3px 0 #000,-2px -2px 0 #ff3fa4; animation:bob 1.1s ease-in-out infinite; opacity:0; transition:opacity .4s; }
  .banner.on { opacity:1; }
  @keyframes bob { 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-8px) rotate(2deg);} }
  @media (prefers-reduced-motion:reduce){ .banner{ animation:none; } }

  .tag { position:fixed; bottom:16px; left:0; right:0; z-index:3; text-align:center; pointer-events:none;
    font-family:var(--display); font-size:clamp(1rem,4vw,1.6rem); color:#fff; text-shadow:2px 2px 0 #000; opacity:0; transition:opacity .4s; }
  .tag.on { opacity:1; }

  /* "tap for sound" overlay — shown only if the browser blocks sound-on-load */
  .gate { position:fixed; inset:0; z-index:5; display:none; place-items:center; text-align:center; padding:24px; cursor:pointer;
    background:radial-gradient(1000px 600px at 50% 40%, rgba(255,63,164,.35), rgba(0,0,0,.72)); }
  .gate.show { display:grid; }
  .gate .inner { font-family:var(--display); color:#fff; }
  .gate .spk { font-size:clamp(3rem,16vw,7rem); line-height:1; animation:beat 1s ease-in-out infinite; }
  .gate .big { font-size:clamp(1.6rem,7vw,3.2rem); margin-top:.3rem; text-shadow:3px 3px 0 #000; }
  .gate .small { font-weight:400; font-family:system-ui,sans-serif; opacity:.85; margin-top:.4rem; font-size:1rem; }
  @keyframes beat { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.14);} }
  @media (prefers-reduced-motion:reduce){ .gate .spk{ animation:none; } }

  .runaway { position:fixed; top:14px; right:14px; z-index:7; width:42px; height:42px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(0,0,0,.45); color:#fff; font-size:1.1rem; transition:top .2s,left .2s,right .2s; }
</style>
</head>
<body>
<video id="vid" src="https://www.image2url.com/r2/default/videos/1791009475641-db52f5a6-c2f4-457a-ada7-e9ab32930859.mp4" autoplay loop playsinline preload="auto"></video>
<div class="flash" id="flash"></div>
<div class="banner" id="banner">NEVER GONNA GIVE YOU UP 🕺</div>
<div class="tag" id="tag">you've been rickrolled 😎</div>

<div class="gate" id="gate" role="button" tabindex="0" aria-label="Tap for sound">
  <div class="inner">
    <div class="spk">🔊</div>
    <div class="big">TAP ANYWHERE</div>
    <div class="small">(turn your volume up 😏)</div>
  </div>
</div>

<button class="runaway" id="runaway" aria-label="Close">✕</button>

<script>
  var vid = document.getElementById('vid'), gate = document.getElementById('gate'),
      flash = document.getElementById('flash'), banner = document.getElementById('banner'), tag = document.getElementById('tag');
  var live = false;

  function goLoud() {
    if (live) return; live = true;
    vid.muted = false;
    try { vid.volume = 1.0; } catch (e) {}
    var p = vid.play(); if (p && p.catch) p.catch(function () {});
    gate.classList.remove('show');
    flash.classList.add('on'); banner.classList.add('on'); tag.classList.add('on');
    try { (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || function () {}).call(document.documentElement); } catch (e) {}
  }

  // 1) try to blast with sound the instant it opens
  vid.muted = false;
  (function tryLoud() {
    var p = vid.play();
    if (p && p.then) {
      p.then(function () { goLoud(); }).catch(function () {
        // blocked: start muted so the picture still autoplays, then wait for any interaction
        vid.muted = true; vid.play().catch(function () {});
        gate.classList.add('show');
      });
    } else { setTimeout(function () { if (!live) { vid.muted = true; gate.classList.add('show'); } }, 300); }
  })();

  // 2) the first interaction anywhere unmutes to full volume
  ['pointerdown', 'keydown', 'touchstart', 'click', 'mousemove', 'scroll'].forEach(function (ev) {
    window.addEventListener(ev, goLoud, { once: true, passive: true });
  });

  // runaway close button (there is no escape)
  (function () {
    var b = document.getElementById('runaway');
    function flee() {
      var pad = 12, w = innerWidth, h = innerHeight;
      b.style.left = (pad + Math.random() * (w - 66 - pad)) + 'px';
      b.style.top = (pad + Math.random() * (h - 66 - pad)) + 'px';
      b.style.right = 'auto';
    }
    b.addEventListener('mouseenter', flee);
    b.addEventListener('click', function (e) { e.stopPropagation(); b.textContent = '😜'; flee(); });
  })();
</script>
</body>
</html>
